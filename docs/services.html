<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | Revah Tech</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background-color:#1a3673;
            background-image:url('images/bg_pattern.png');
            background-size:cover;
            background-position:center;
            color:white;
            height:100vh;
            overflow:hidden;
            display:flex;
            flex-direction:column;
        }

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:40px 80px;
        }

        .logo{
            height:45px;
        }
        .menu-container{
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
            font-size:1.1rem;
            font-weight:600;
        }

        .menu-icon{
            height:24px;
        }

        /* --- SIDEBAR --- */

        #revah-sidebar{
            position:fixed;
            top:0;
            right:-1000px;
            width:300px;
            height:100vh;
            background:#112554;
            transition:0.4s ease;
            z-index:1000;
            padding:40px;
            box-shadow:-5px 0 15px rgba(0,0,0,0.5);
        }

        #revah-sidebar.active{
            right:0;
        }

        .sidebar-header{
            display:flex;
            justify-content:flex-end;
            margin-bottom:60px;
        }

        .close-btn{
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
            font-weight:600;
        }

        .revah-links{
            list-style:none;
            display:flex;
            flex-direction:column;
            gap:25px;
        }

        .revah-links a{
            color:white;
            text-decoration:none;
            display:flex;
            align-items:center;
            gap:10px;
            font-size:1.1rem;
        }

        .revah-links a:hover{
            color:#b3c2f2;
        }

        .revah-arrow{
            display:inline-block;
            transition:transform 0.3s ease;
            font-size:0.8rem;
        }

        .revah-submenu{
            max-height:0;
            overflow:hidden;
            opacity:0;
            visibility:hidden;
            transition:all 0.3s ease;
            margin-left:25px;
            margin-top:0;
        }

        .revah-submenu.show-menu{
            max-height:300px;
            opacity:1;
            visibility:visible;
            margin-top:10px;
        }

        .revah-submenu-list{
            list-style:none;
            display:flex;
            flex-direction:column;
            gap:15px;
            padding:10px 0;
        }

        .revah-submenu-list a{
            color:#d1d8f0;
            font-size:1rem;
        }

        /* --- SERVICES PAGE CONTENT --- */

        .services-main{
            flex:1;
            overflow-y:auto;
            padding:20px 80px 80px;
        }

        .page-title{
            text-align:center;
            font-size:3rem;
            margin-bottom:60px;
        }

        .services-grid{
            display:flex;
            justify-content:center;
            gap:40px;
            flex-wrap:wrap;
        }

        .service-card-link {
            text-decoration: none;
            color: inherit;
        }

        .service-card{
            display:flex;
            flex-direction:column;
            align-items:center;
            transition:0.3s ease;
            cursor:pointer;
        }

        .service-card:hover{
            transform:translateY(-8px);
        }

        .service-img-wrapper{
            width:280px;
            height:280px;
            border-radius:20px;
            overflow:hidden;
            background:rgba(255,255,255,0.05);
            border:2px solid transparent;
            transition:0.3s ease;
        }

        .service-card:hover .service-img-wrapper{
            border-color:#8b5cf6;
            box-shadow:0 0 20px rgba(139,92,246,0.3);
        }

        .service-img-wrapper img{
            width:100%;
            height:100%;
            object-fit:contain;
            padding:10px;
        }

        .service-title{
            margin-top:25px;
            font-size:1.3rem;
        }

        @media(max-width:768px){
            nav{
                padding:25px;
            }

            .services-main{
                padding:20px;
            }

            .page-title{
                font-size:2.2rem;
            }

            #revah-sidebar{
                width:100%;
            }

            .service-img-wrapper{
                width:100%;
                max-width:320px;
                height:250px;
            }
        }
    </style>
</head>
<body>

    <div id="revah-sidebar">

        <div class="sidebar-header">
            <div class="close-btn" id="revah-close-btn">
                <img src="images/menu_icon.png" class="menu-icon">
                <span>Close</span>
            </div>
        </div>

        <ul class="revah-links">

            <li><a href="about.html">About Us</a></li>

            <li>
                <a href="#" class="revah-toggle" data-target="submenu-services">
                    <span class="revah-arrow">▶</span>
                    Services
                </a>

                <div id="submenu-services" class="revah-submenu">
                    <ul class="revah-submenu-list">
                        <li><a href="service_ai.html">Artificial Intelligence</a></li>
                        <li><a href="service_app_dev.html">App Development</a></li>
                        <li><a href="service_web_dev.html">Website Development</a></li>
                    </ul>
                </div>
            </li>

            <li>
                <a href="#" class="revah-toggle" data-target="submenu-products">
                    <span class="revah-arrow">▶</span>
                    Products
                </a>

                 <div id="submenu-products" class="revah-submenu">
                    <ul class="revah-submenu-list">
                        <li><a href="nexax.html">NexaX</a></li>
                        <li><a href="nexaschool.html">CRMSchool</a></li>
                    </ul>
                </div>
            </li>

            <li><a href="team.html">Our Team</a></li>
            <li><a href="contact.html">Contact Us</a></li>

        </ul>

    </div>

    <nav>
        <a href="index.html">
            <img src="images/logo.png" class="logo">
        </a>

        <div class="menu-container" id="revah-open-btn">
            <img src="images/menu_icon.png" class="menu-icon">
            <span>Menu</span>
        </div>
    </nav>

    <main class="services-main">

        <h1 class="page-title">Services</h1>

        <div class="services-grid">

            <a href="service_ai.html" class="service-card-link">
                <div class="service-card">
                    <div class="service-img-wrapper">
                        <img src="images/service_ai.png" alt="AI">
                    </div>
                    <h3 class="service-title">Artificial Intelligence</h3>
                </div>
            </a>

            <a href="service_app_dev.html" class="service-card-link">
                <div class="service-card">
                    <div class="service-img-wrapper">
                        <img src="images/service_app.png" alt="App Development">
                    </div>
                    <h3 class="service-title">App Development</h3>
                </div>
            </a>

            <a href="service_web_dev.html" class="service-card-link">
                <div class="service-card">
                    <div class="service-img-wrapper">
                        <img src="images/service_web.png" alt="Web Development">
                    </div>
                    <h3 class="service-title">Web Development</h3>
                </div>
            </a>

        </div>

    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        const sidebar = document.getElementById('revah-sidebar');
        const openBtn = document.getElementById('revah-open-btn');
        const closeBtn = document.getElementById('revah-close-btn');
        const toggles = document.querySelectorAll('.revah-toggle');
        const allSubmenus = document.querySelectorAll('.revah-submenu');
        const allArrows = document.querySelectorAll('.revah-arrow');

        function closeAllSubmenus(){
            allSubmenus.forEach(menu => {
                menu.classList.remove('show-menu');
            });

            allArrows.forEach(arrow => {
                arrow.style.transform = 'rotate(0deg)';
            });
        }

        openBtn.addEventListener('click', () => {
            sidebar.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            sidebar.classList.remove('active');
            closeAllSubmenus();
        });

        toggles.forEach(toggle => {
            toggle.addEventListener('click', (e) => {
                e.preventDefault();

                const targetMenu = document.getElementById(
                    toggle.getAttribute('data-target')
                );
                const arrow = toggle.querySelector('.revah-arrow');
                const isOpen = targetMenu.classList.contains('show-menu');

                closeAllSubmenus();

                if(!isOpen){
                    targetMenu.classList.add('show-menu');
                    arrow.style.transform = 'rotate(90deg)';
                }
            });
        });
    });
    </script>
</body>
</html>
