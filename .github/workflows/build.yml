name: Build HTML from Java sources

on:
  push:
    branches: [main]
    paths:
      - 'docs/**.java'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java sources and emit HTML
        working-directory: docs
        run: |
          javac *.java
          for f in *.java; do
            name="${f%.java}"
            java -cp . "$name" > "${name}.html"
          done
          rm -f *.class

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html
          if git diff --staged --quiet; then
            echo "No HTML changes to commit"
          else
            git commit -m "Auto-generate HTML from Java sources [skip ci]"
            git push
          fi
